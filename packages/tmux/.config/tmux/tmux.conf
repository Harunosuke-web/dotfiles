# tmux の設定。
# ペイン操作とコピーモードを Vim に寄せた構成
# （元は Daniel Thau 氏の vim-keys.conf, public domain）

# split windows like vim
# vim's definition of a horizontal/vertical split is reversed from tmux's
# Vim の呼び方に合わせる（tmux 本来の -h / -v とは逆）
#   v = :vsplit 相当 → 左右に並ぶ
#   s = :split  相当 → 上下に並ぶ
bind -N "🎯 [VIM-LIKE] 左右に分割" v split-window -h
bind -N "🎯 [VIM-LIKE] 上下に分割" s split-window -v

# 文字の形が仕切りの向きと一致する割り当て。
# Ctrl 不要なので、端末による Ctrl+記号 の送出差に影響されない
bind -N "🎯 左右に分割（仕切りが縦）" | split-window -h
bind -N "🎯 上下に分割（仕切りが横）" - split-window -v
# | は Shift が要るので、同じ位置の \ でも左右に分割できるようにする
bind -N "🎯 左右に分割（仕切りが縦）" '\' split-window -h

# Ctrl を押したまま続けたい場合。ただし Ctrl+記号 の送出は端末依存で、
# 届かない端末もある（届かない時は上の | \ - を使う）
bind -N "🎯 左右に分割" C-\\ split-window -h
bind -N "🎯 上下に分割" C-\_ split-window -v

# move around panes with hjkl, as one would in vim after pressing ctrl-w
bind -N "🎯 [VIM-LIKE] Select pane left" h select-pane -L
bind -N "🎯 [VIM-LIKE] Select pane down" j select-pane -D
bind -N "🎯 [VIM-LIKE] Select pane up" k select-pane -U
bind -N "🎯 [VIM-LIKE] Select pane right" l select-pane -R

# prefix 無しで Option(Alt)+h/j/k/l でペイン移動（連続移動できるよう -r 付き）
# Mac + Alacritty では Option が Alt(Meta) を送る設定が必要:
#   Alacritty: [window] option_as_alt を設定（現在は "OnlyLeft"）
#   Ghostty:   macos-option-as-alt を設定（現在は left）
bind -rn -N "🎯 [NO-PREFIX] Select pane left"  M-h select-pane -L
bind -rn -N "🎯 [NO-PREFIX] Select pane down"  M-j select-pane -D
bind -rn -N "🎯 [NO-PREFIX] Select pane up"    M-k select-pane -U
bind -rn -N "🎯 [NO-PREFIX] Select pane right" M-l select-pane -R

# ペインのサイズ変更。移動が h j k l なので、大文字を対応させる。
# -r 付きなので prefix を押し直さずに連続で調整できる
bind -r -N "🎯 [VIM-LIKE] サイズ変更: 左" H resize-pane -L 3
bind -r -N "🎯 [VIM-LIKE] サイズ変更: 下" J resize-pane -D 3
bind -r -N "🎯 [VIM-LIKE] サイズ変更: 上" K resize-pane -U 3
bind -r -N "🎯 [VIM-LIKE] サイズ変更: 右" L resize-pane -R 3

# Reload config file
bind -N "⚡ [CUSTOM] Reload tmux config" r source-file "$XDG_CONFIG_HOME"/tmux/tmux.conf \; display "tmux.conf reloaded!"

# vi-style controls for copy mode
setw -g mode-keys vi

# 'v' で選択を始める
bind -T copy-mode-vi v send -X begin-selection

# 'V' で行選択
bind -T copy-mode-vi V send -X select-line

# 'C-v' で矩形選択
bind -T copy-mode-vi C-v send -X rectangle-toggle

# 'y' でヤンク: "pbcopy" is for Mac/Linux, "xsel -bi" is for Win
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xsel -bi"
# bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xsel -bi"

# 'Y' で行ヤンク
bind -T copy-mode-vi Y send -X copy-line

# 'C-p'でペースト
bind-key C-p paste-buffer

# --- lazygit --- #
bind -N "🔧 [POPUP] Open git client (lazygit)" C-g popup -w100% -h98% -y35 -E lazygit

# --- lf --- #
bind -N "🔧 [POPUP] Open file manager (lf)" C-e popup -w90% -h90% -E ~/.local/bin/lf-tmux

# --- tmux-sessionizer --- #
bind-key -r -N "🔧 [POPUP] Create/switch session" C-f display-popup -w 100% -h 100% -E "~/.local/bin/tmux-sessionizer-popup"

# --- セッション管理 --- #
# 標準の prefix + d に加えて prefix + C-d でも切り離せるようにする。
# prefix を押した指で Ctrl を離さずに続けられる。セッションは残る
bind-key -N "🔌 Detach client" C-d detach-client
bind-key -N "🔧 [POPUP] Kill session" C-x display-popup -w 100% -h 100% -E "~/.local/bin/tmux-kill-session"
bind-key -N "🔧 [POPUP] Switch session" C-s display-popup -w 100% -h 100% -E "~/.local/bin/tmux-switch-session"
# 任意の名前で新規セッションを作成（現在のディレクトリで開始）
bind-key -N "🆕 New named session" C-n command-prompt -p "New session:" "new-session -c '#{pane_current_path}' -s '%%'"
# 元の新ウィンドウ版（バックアップ）
# bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# 基本設定
## tmux 内側の TERM。screen-256color だと nvim が必要とする機能が不足する
set -g default-terminal "tmux-256color"
## 外側の端末が持つ機能を宣言する。alacritty は env で TERM=alacritty を設定済み
## 使う端末ごとに宣言する。TERM の値で判定されるため、端末を変えるなら追記が必要
set -as terminal-features ',alacritty:RGB'         # 24bit カラー（カラースキームの色を落とさない）
set -as terminal-features ',alacritty:usstyle'     # 下線スタイル（nvim の診断の波線）
set -as terminal-features ',xterm-ghostty:RGB'     # Ghostty は TERM=xterm-ghostty になる
set -as terminal-features ',xterm-ghostty:usstyle'
## ウィンドウのフォーカス変化を nvim へ伝える（FocusGained/FocusLost）。
## 外部でファイルが変わった時の自動再読込や gitsigns の更新に必要
set -g focus-events on
## Escキーの遅延を解消
set -s escape-time 0
## メッセージの表示時間。0 は「キーを押すまで消さない」という意味なので、
## 出っぱなしになる。既定は 750ms でエラーを読む前に消えるため 2 秒にする
set -g display-time 2000
## ウィンドウ名の自動更新
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
## その他のちらつき軽減設定
set -g visual-activity off
set -g visual-bell off
## status line を更新する間隔を60秒にする（ちらつき軽減）
set-option -g status-interval 60
## スクロールバックの行数。既定の 2000 行ではビルドログですぐ溢れる
set -g history-limit 50000
## ウィンドウを閉じた時に番号を振り直す。
## 既定では 1, 2, 4 のように穴が空き、prefix + 数字での移動とずれる
set -g renumber-windows on
## ウィンドウのインデックスを1から始める
set -g base-index 1
## ペインのインデックスを1から始める
setw -g pane-base-index 1
# マウス操作を有効にする
set-option -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
## ペインの中身の背景色。試験的に無効化している。
## 有効にすると、アプリが自分で塗らない領域（シェルのプロンプトより下など）が
## この色になる。nvim のペインは nvim 自身が塗るため見えない。
##
## 無効の間は端末の背景がそのまま出るので、Ghostty / nvim と色が揃う。
## 戻す場合は下の 2 行のコメントを外して prefix + r で再読み込みする。
## なお colour233(#121212) は colour234(#1c1c1c) より暗いため、
## 元の設定ではアクティブなペインの方が暗くなっていた（コメントとは逆）
# set -g window-style 'bg=colour234'          # 非アクティブなペイン
# set -g window-active-style 'bg=colour233'   # アクティブなペイン

### status lineの設定 ###
set -g status-position "top"
# ## window-status を中央揃えで配置する
set-option -g status-justify "centre"
# ## status line の背景色を指定する。
set-option -g status-bg "colour236"
# ## status line の文字色を指定する。
set-option -g status-fg "colour255"

# ---- left ---- #
set-option -g status-left-length 100
set-option -g status-left "#[fg=colour255 bg=colour236] Session: #I.#P  #S #[default] "
# set-option -g status-left " #S:#I.#P "

# ---- center ---- #
setw -g window-status-current-format '\
#[fg=colour236]#[bg=colour236] #[bg=colour236]#[fg=colour119]\
#I#[fg=colour236]:#[fg=colour255]#W#[fg=colour249]\
#F#[fg=colour236]#[bg=colour236]'

setw -g window-status-format ' #I#[fg=colour236]:#[fg=colour250]#W#[fg=colour244]#F '

# ---- right ---- #
set -g status-right-length 80
set -g status-right \
    "#{?client_prefix,#[reverse],}""\
""#[fg=colour255,bg=colour236] %Y/%m/%d(%a)""
